[workspace]
name = "phamseek"
version = "0.1.0"
description = "Phage detection in low-biomass clinical ONT metagenomes"
authors = ["Jinlong Ru <jinlong.ru@tum.de>"]
channels = ["conda-forge", "bioconda"]
# linux-64 is the deployment target (collaborator workstation).
# linux-aarch64 is the development platform (DGX Spark).
# Keeping both resolved is free and lets the collaborator `pixi install`
# without re-solving.
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
# --- orchestration ---
nextflow = ">=24.10"

# --- long-read QC (Oxford Nanopore cDNA libraries) ---
chopper = "*"
nanoq = "*"

# --- host depletion (level 2) ---
minimap2 = "*"
samtools = "*"

# --- taxonomic profiling ---
kraken2 = ">=2.1.3"
bracken = "*"
krakentools = "*"

# --- reserved for Tier 2 (assembly + viral validation).
#     Installed so the environment does not have to be re-solved when
#     `--mode full` is implemented; deliberately NOT wired into the workflow.
flye = "*"
genomad = "*"
checkv = "*"

# --- utilities / reporting ---
seqkit = "*"
csvtk = "*"
pigz = "*"
python = ">=3.10"
pandas = "*"

[tasks]
version = "nextflow -version"
