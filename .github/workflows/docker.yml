name: Docker

# Build docker.io/jinlongru/nf-phamseek for linux/amd64 + linux/arm64 and publish
# it to Docker Hub.
#
# Both architectures are built NATIVELY, each on its own GitHub-hosted runner,
# and joined afterwards into one multi-arch manifest. The obvious alternative --
# one runner with QEMU and `platforms: linux/amd64,linux/arm64` -- emulates every
# conda package's post-link script, which turns a ~10 minute solve into hours and
# occasionally miscompiles. Native runners for both are free on a public
# repository, so there is nothing to trade off.
#
# The two build jobs push by DIGEST only (no tag). Tags are attached once, by the
# `manifest` job, so a half-finished matrix can never leave `:latest` pointing at
# a single architecture.
#
# Triggers
#   push tag v*      -> :vX.Y.Z and :latest
#   push to main     -> :edge          (only when something the image depends on changed)
#   pull_request     -> build only, never push
#   workflow_dispatch
#
# Secrets: DOCKER_USER, DOCKER_PASSWORD (a Docker Hub access token).

on:
  push:
    branches: [main]
    paths:
      - "pixi.toml"
      - "pixi.lock"
      - "docker/Dockerfile"
      - ".github/workflows/docker.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "pixi.toml"
      - "pixi.lock"
      - "docker/Dockerfile"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: docker.io/jinlongru/nf-phamseek

jobs:
  # Does this tag actually need a new image?
  #
  # The image is a function of exactly two files: pixi.lock and the Dockerfile.
  # A release that touches neither -- a documentation pass, a wiring fix, a
  # renamed parameter -- would otherwise spend ~11 minutes rebuilding an image
  # whose contents are already published under the previous tag.
  #
  # Rebuilding is not merely slow, it is worse than retagging. Two independent
  # builds of the SAME commit and the SAME lock produced different digests
  # (measured on v0.2.0 vs edge: layers 0-4 and 7 identical, the 2.03 GB conda
  # layer differing by 20 KB -- .pyc files, mtimes, conda-meta ordering). So a
  # rebuild forces you to argue that the contents are equivalent, while a retag
  # leaves the new tag pointing at the very same digest, which needs no argument.
  #
  # `manifest.version` and the image tag stay in lockstep either way: whoever
  # reads 0.2.1 in a report still finds :v0.2.1 on Docker Hub.
  probe:
    name: does the image need rebuilding?
    runs-on: ubuntu-24.04
    outputs:
      rebuild: ${{ steps.check.outputs.rebuild }}
      base: ${{ steps.check.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          # git describe needs the tags, and diffing against the previous
          # release needs the commits between them.
          fetch-depth: 0

      - name: Compare pixi.lock and the Dockerfile against the previous tag
        id: check
        run: |
          set -eu
          say() { printf '%s\n' "$*" >> "${GITHUB_STEP_SUMMARY}"; }

          # A manual dispatch is the escape hatch: it always rebuilds, whatever
          # ref it was launched from. That is the whole point of reaching for it.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "rebuild=true" >> "${GITHUB_OUTPUT}"
              say "Building: manual dispatch always rebuilds."
              exit 0
          fi

          # Only a version tag can inherit an earlier image; a push to main
          # publishes :edge, which is by definition the untested tip.
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
              echo "rebuild=true" >> "${GITHUB_OUTPUT}"
              say "Building: not a version tag."
              exit 0
          fi

          prev=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -z "${prev}" ]; then
              echo "rebuild=true" >> "${GITHUB_OUTPUT}"
              say "Building: ${GITHUB_REF_NAME} is the first version tag."
              exit 0
          fi

          if ! git diff --quiet "${prev}" "${GITHUB_REF_NAME}" -- pixi.lock docker/Dockerfile; then
              echo "rebuild=true" >> "${GITHUB_OUTPUT}"
              say "Building: pixi.lock or docker/Dockerfile changed since ${prev}."
              git diff --stat "${prev}" "${GITHUB_REF_NAME}" -- pixi.lock docker/Dockerfile >> "${GITHUB_STEP_SUMMARY}"
              exit 0
          fi

          # The inputs match, but the previous image has to exist before we can
          # point a new name at it. A public repository needs no credentials to
          # be inspected.
          if ! docker buildx imagetools inspect "${IMAGE}:${prev}" > /dev/null 2>&1; then
              echo "rebuild=true" >> "${GITHUB_OUTPUT}"
              say "Building: ${IMAGE}:${prev} is not on the registry to inherit from."
              exit 0
          fi

          echo "rebuild=false" >> "${GITHUB_OUTPUT}"
          printf 'base=%s\n' "${prev}" >> "${GITHUB_OUTPUT}"
          say "Retagging ${prev} as ${GITHUB_REF_NAME}: pixi.lock and docker/Dockerfile are unchanged."

  # pixi.lock is what makes every delivery route resolve to the same software.
  # A lock nothing checks is a comment, so it is verified before anything is
  # built from it.
  #
  # `--dry-run` is not optional: plain `pixi lock --check` exits non-zero on
  # drift but REWRITES pixi.lock on its way out, which leaves the build running
  # against a lock CI just silently repaired.
  lock:
    name: pixi.lock matches pixi.toml
    needs: probe
    if: needs.probe.outputs.rebuild == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.73.0
          run-install: false

      - run: pixi lock --check --dry-run

  build:
    name: build ${{ matrix.platform }}
    needs: lock
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      # The unpacked environment is ~5 GB and the runner ships with an Android
      # SDK and a .NET toolchain it will never use here.
      - name: Reclaim disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hosted_tool_cache}" || true
          docker system prune -af || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build (and push by digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          # No `tags:` and no `push:` here on purpose -- see the header.
          # push-by-digest is configured through `outputs`, and setting the
          # `push:` input as well makes buildx receive two conflicting export
          # definitions.
          outputs: |
            type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # Digests travel to the manifest job as one file per architecture, so the
      # two matrix legs never race on the same artifact name.
      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          echo -n "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  # The cheap path: point a new name at the image the previous tag already
  # published. This is a registry-side operation -- nothing is pulled, nothing
  # is rebuilt, and the new tag resolves to the identical digest, which is what
  # makes "same software" verifiable rather than merely asserted.
  #
  # It is the same command the manifest job below uses; only the source differs
  # (an existing tag rather than a set of freshly pushed digests).
  retag:
    name: retag the previous image
    needs: probe
    if: needs.probe.outputs.rebuild == 'false' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Point the new tag at the existing image
        env:
          BASE: ${{ needs.probe.outputs.base }}
        run: |
          set -eu
          docker buildx imagetools create \
              -t "${IMAGE}:${GITHUB_REF_NAME}" \
              -t "${IMAGE}:latest" \
              "${IMAGE}:${BASE}"

      - name: Prove both tags resolve to the same digest
        env:
          BASE: ${{ needs.probe.outputs.base }}
        run: |
          set -eu
          # Not decoration: this is the whole claim being made. If these ever
          # differ, something rebuilt when it should not have.
          # Two ways of asking, because the --format template has moved between
          # buildx releases and a broken assertion is worse than a verbose one.
          digest_of() {
              docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$1" 2>/dev/null \
                  || docker buildx imagetools inspect "$1" | awk '/^Digest:/ { print $2; exit }'
          }
          old=$(digest_of "${IMAGE}:${BASE}")
          new=$(digest_of "${IMAGE}:${GITHUB_REF_NAME}")
          [ -n "${old}" ] && [ -n "${new}" ] || { echo "could not read a digest back"; exit 1; }
          printf '%s -> %s\n%s -> %s\n' "${BASE}" "${old}" "${GITHUB_REF_NAME}" "${new}"
          [ "${old}" = "${new}" ] || { echo "digests differ; the retag did not do what it claims"; exit 1; }
          {
            printf '`%s` and `%s` both resolve to `%s`.\n' \
                   "${BASE}" "${GITHUB_REF_NAME}" "${new}"
          } >> "${GITHUB_STEP_SUMMARY}"

  # Skipped along with `build` when the probe decided a retag is enough --
  # GitHub skips a job whose `needs` were skipped, which is the behaviour wanted
  # here rather than something to work around.
  manifest:
    name: publish multi-arch manifest
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # A version tag publishes :vX.Y.Z and moves :latest. Anything else
      # publishes :edge, which is explicitly the untested tip -- `-profile
      # apptainer` pins a version tag, never :latest, so a push to main cannot
      # change what a running analysis resolves to.
      - name: Compute tags
        id: tags
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              printf 'tags=-t %s:%s -t %s:latest\n' \
                  "${IMAGE}" "${GITHUB_REF_NAME}" "${IMAGE}"          >> "${GITHUB_OUTPUT}"
          else
              printf 'tags=-t %s:edge\n' "${IMAGE}"                   >> "${GITHUB_OUTPUT}"
          fi

      - name: Create and push the manifest list
        working-directory: /tmp/digests
        run: |
          set -eu
          ls -l
          # shellcheck disable=SC2046
          docker buildx imagetools create ${{ steps.tags.outputs.tags }} \
              $(for f in *; do printf '%s@%s ' "${IMAGE}" "$(cat "$f")"; done)

      - name: Show what was published
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then ref="${GITHUB_REF_NAME}"; else ref="edge"; fi
          docker buildx imagetools inspect "${IMAGE}:${ref}"
