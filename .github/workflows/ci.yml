name: CI

# Wiring tests. Nothing here needs a reference database or a container: `-stub`
# replaces every tool invocation with the module's stub block, so what is under
# test is the channel topology, the samplesheet parser and the parameter
# validation -- the parts that break silently.
#
# `-profile nocontainer` is what makes that cheap: it turns off the default Apptainer
# provisioning, so the stub scripts (printf, touch, gzip) run straight on the
# runner instead of pulling a 5 GB image to run `touch`.

# MANUAL ONLY, on request (2026-08-20). The automatic push/pull_request triggers
# were removed while the delivery was being cut, so a red badge on a test harness
# could not be mistaken for a broken pipeline. Nothing here gates a release.
# Re-enable by restoring:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stub:
    name: stub run (${{ matrix.NXF_VER }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in the manifest, and the current release. The floor
        # is tested because it is a promise: `nextflowVersion = '!>=24.04.0'`
        # makes Nextflow refuse to run below it, and nothing else checks that
        # the pipeline actually still works there. 24.04 is the floor because
        # that is where `process.resourceLimits` appeared.
        NXF_VER: ["24.04.0", "latest-stable"]
    env:
      NXF_ANSI_LOG: false
      # Deliberately NOT set to v1. The strict parser is the default from
      # Nextflow 26.04 on, and a developer with NXF_SYNTAX_PARSER=v1 exported in
      # their shell sees none of the errors it raises -- which is exactly how the
      # config reached CI with a `def` function in it that no current Nextflow
      # will parse. CI is the only place that guarantee is checked.
    steps:
      - uses: actions/checkout@v4

      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.NXF_VER }}

      # --max_memory / --max_cpus are NOT cosmetic here. conf/test.config asks for
      # 16 GB so that `-profile test` with a real kraken2 database can actually
      # load one; a GitHub runner has 15.6 GB, and Nextflow refuses to schedule a
      # task whose request exceeds physical memory ("Process requirement exceeds
      # available memory"). The stub tasks need no memory at all.
      #
      # `set -o pipefail` is load-bearing: `nextflow ... | tee` reports tee's exit
      # status, so without it a failed run left this step green and only the next
      # step noticed -- which is how the failure above was reported against the
      # wrong process.
      - name: Stub run
        run: |
          set -o pipefail
          nextflow run . -profile test,nocontainer -stub \
              --max_memory 6.GB --max_cpus 2 \
              --outdir results_stub 2>&1 | tee stub.log

      # An exit code alone is not enough: Nextflow can complete with processes
      # that never ran. Assert against the execution trace, not the console log
      # -- Nextflow elides long process names in the log ("PHAMSEEK:KRAKEN2_R..."),
      # so grepping the log reports whichever name happened to be truncated as
      # "did not run" while the pipeline was in fact fine. The trace carries
      # every task's full name.
      - name: Every stage ran and the run-level report was produced
        run: |
          set -eu
          trace=$(ls results_stub/pipeline_info/execution_trace_*.txt)
          for proc in ONT_QC KRAKEN2_READS HOST_SPLIT_L1 HOST_DEPLETION_L2 \
                      DB_MANIFEST PHAMSEEK_REPORT PHAMSEEK_SUMMARY; do
              grep -q "PHAMSEEK:${proc}" "${trace}" || {
                  echo "${proc} did not run"; cat "${trace}"; exit 1; }
          done
          test -s results_stub/summary/phamseek_summary.tsv
          test -s results_stub/summary/phamseek_report.html

      - name: '--mode full is refused, with a reason'
        run: |
          if nextflow run . -profile test,nocontainer -stub --mode full \
                 --max_memory 6.GB --max_cpus 2 \
                 --outdir results_mode_full > mode_full.log 2>&1; then
              echo "--mode full was accepted"; exit 1
          fi
          grep -q "not implemented in phamseek v0.1" mode_full.log || {
              echo "rejected, but not for the expected reason"; cat mode_full.log; exit 1; }

      # The command-line form on purpose: it is what a user types, and it only
      # reaches the guard because validationLenientMode coerces the String and
      # skipBracken() converts it. Both of those have silently regressed before.
      - name: 'bracken without --bracken_read_length is refused'
        run: |
          if nextflow run . -profile test,nocontainer -stub --skip_bracken false \
                 --max_memory 6.GB --max_cpus 2 \
                 --outdir results_bracken > bracken.log 2>&1; then
              echo "bracken was enabled without a read length"; exit 1
          fi
          grep -q "bracken_read_length is required" bracken.log || {
              echo "rejected, but not for the expected reason"; cat bracken.log; exit 1; }

      # `--skip_host_removal false` must LEAVE level 2 running. It silently
      # skipped it before skipBracken()/skipHostRemoval() existed, because
      # Groovy reads the String "false" as true. A silent skip of host depletion
      # on clinical data is the worst failure this pipeline can have.
      - name: 'a boolean passed as false is honoured, not read as truthy'
        run: |
          set -eu
          nextflow run . -profile test,nocontainer -stub --skip_host_removal false \
              --max_memory 6.GB --max_cpus 2 --outdir results_l2on > l2on.log 2>&1
          grep -q "PHAMSEEK:HOST_DEPLETION_L2" results_l2on/pipeline_info/execution_trace_*.txt || {
              echo "--skip_host_removal false silently skipped level-2 host depletion"; exit 1; }
          nextflow run . -profile test,nocontainer -stub --skip_host_removal true \
              --max_memory 6.GB --max_cpus 2 --outdir results_l2off > l2off.log 2>&1
          grep -q "PHAMSEEK:HOST_DEPLETION_L2" results_l2off/pipeline_info/execution_trace_*.txt && {
              echo "--skip_host_removal true still ran level-2 host depletion"; exit 1; }
          true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stub-logs-${{ matrix.NXF_VER }}
          path: |
            *.log
            .nextflow.log
            results_stub/pipeline_info/
          if-no-files-found: ignore

  lint:
    name: shellcheck + python syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck the deployment scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning deploy/*.sh deploy/apptainer/*.sh

      - name: compile the bin/ scripts
        run: python3 -m compileall -q bin/
